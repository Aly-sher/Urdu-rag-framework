[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "urdu-rag-framework"
version = "0.1.0"
description = "A typology-driven, research-grade Retrieval-Augmented Generation framework for low-resource languages."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ali Sher Khan Tareen " }]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "peft>=0.6.0",
    "tokenizers>=0.15.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "datasets>=2.14.0",
    "setuptools<71.0.0", 
    # NOTE: lang2vec must be installed manually via: 
    # pip install git+https://github.com/antonisa/lang2vec.git
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
# This creates the 'urdu-rag' command in your terminal once the CLI is built
urdu-rag = "urdu_rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/urdu_rag"]

